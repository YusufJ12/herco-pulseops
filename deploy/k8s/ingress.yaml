apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pulseops-ingress
  namespace: pulseops
  labels:
    app.kubernetes.io/name: pulseops
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  tls:
    - hosts:
        - pulseops.local
      secretName: pulseops-tls-cert
  rules:
    - host: pulseops.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: pulseops-service
                port:
                  number: 8080
